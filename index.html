<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 3.0 專屬 AI Agent</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 330px;
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .sidebar h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.85rem; font-weight: 600; color: #475569; display: flex; justify-content: space-between; align-items: center; }
    input, textarea, select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
    }
    textarea { resize: vertical; min-height: 85px; }
    
    .refresh-btn {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
    .refresh-btn:hover { background: #cbd5e1; }

    .tool-badge {
      font-size: 0.85rem;
      background: #eff6ff;
      color: var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      width: 100%;
    }
    .tool-badge:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      transform: translateY(-1px);
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.08);
    }
    .tool-badge:active { transform: translateY(0); }

    .status-tip { font-size: 0.75rem; color: #16a34a; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .chat-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.agent {
      background: var(--card);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .msg.tool {
      background: #fefce8;
      border: 1px solid #fde047;
      color: #854d0e;
      font-family: monospace;
      font-size: 0.82rem;
      align-self: flex-start;
    }
    .input-area {
      padding: 16px 24px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    button.send-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button.send-btn:hover { opacity: 0.9; }
    button.secondary {
      background: #64748b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: auto;
    }
    button.secondary:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <!-- 左側設定欄 -->
  <div class="sidebar">
    <h2>✨ Gemini Agent</h2>
    
    <div class="field">
      <label>Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="貼上 AIzaSy..." oninput="saveSettings(); fetchAvailableModels();">
      <span class="status-tip" id="saveStatus">金鑰將自動儲存於本地瀏覽器</span>
    </div>

    <div class="field">
      <label>
        <span>可用模型 (自動偵測)</span>
        <button type="button" class="refresh-btn" onclick="fetchAvailableModels()">🔄 重新抓取清單</button>
      </label>
      <select id="model" onchange="saveSettings()">
        <option value="gemini-3-flash-preview">載入中或請點擊重新抓取...</option>
      </select>
      <span class="status-tip" id="modelStatus" style="color:#64748b;">會自動列出帳號支援的所有模型</span>
    </div>

    <div class="field">
      <label>系統指令 (System Prompt)</label>
      <textarea id="systemPrompt" oninput="saveSettings()">你是一個聰明、務實的個人 AI Agent。回答請使用繁體中文，保持精簡有條理。遇到時間、數學計算或天氣查詢時，請務必呼叫對應的工具。</textarea>
    </div>

    <div class="field">
      <label>🛠️ 已掛載工具 (點擊直接執行)</label>
      <button type="button" class="tool-badge" onclick="triggerTool('time')">🕒 get_current_time (台灣時間)</button>
      <button type="button" class="tool-badge" onclick="triggerTool('calc')">🧮 calculate (數學四則運算)</button>
      <button type="button" class="tool-badge" onclick="triggerTool('weather')">🌤️ get_weather (即時經緯度天氣)</button>
    </div>

    <button class="secondary" onclick="clearMemory()">🗑️ 清除對話記憶</button>
  </div>

  <!-- 右側對話區 -->
  <div class="main">
    <div class="chat-box" id="chatBox">
      <div class="msg agent">你好！我現在會自動幫你查詢這把 API Key 支援的所有 Gemini 模型名稱，選好模型後點左側工具按鈕就能立即執行！</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="輸入訊息，或點擊左側工具按鈕..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">發送</button>
    </div>
  </div>

  <script>
    let conversationHistory = [];

    window.addEventListener('DOMContentLoaded', async () => {
      const savedKey = localStorage.getItem('gemini_agent_key');
      const savedPrompt = localStorage.getItem('gemini_agent_prompt');

      if (savedPrompt) document.getElementById('systemPrompt').value = savedPrompt;
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
        await fetchAvailableModels(); // 啟動時自動抓取官方支援的模型清單
      }
    });

    function saveSettings() {
      localStorage.setItem('gemini_agent_key', document.getElementById('apiKey').value.trim());
      localStorage.setItem('gemini_agent_model', document.getElementById('model').value);
      localStorage.setItem('gemini_agent_prompt', document.getElementById('systemPrompt').value);
      document.getElementById('saveStatus').textContent = '✅ 已自動儲存';
    }

    // 自動向 Google 查詢這把 API Key 可用的所有模型 (ListModels)
    async function fetchAvailableModels() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const statusEl = document.getElementById('modelStatus');
      const selectEl = document.getElementById('model');

      if (!apiKey) {
        statusEl.textContent = '⚠️ 請先輸入 API Key';
        return;
      }

      statusEl.textContent = '⏳ 正在向 Google 查詢可用模型...';
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        // 過濾出支援 generateContent 且屬於 gemini 系列的模型
        const validModels = (data.models || [])
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
          .map(m => m.name.replace('models/', ''))
          .filter(name => name.startsWith('gemini') && !name.includes('vision') && !name.includes('embedding'));

        // 優先把包含 3 與 flash 的最新模型排在最前面
        validModels.sort((a, b) => {
          const score = (n) => (n.includes('3') ? 10 : 0) + (n.includes('flash') ? 5 : 0);
          return score(b) - score(a);
        });

        selectEl.innerHTML = '';
        validModels.forEach(modelName => {
          const opt = document.createElement('option');
          opt.value = modelName;
          opt.textContent = modelName;
          selectEl.appendChild(opt);
        });

        // 自動選取最推薦的第一個模型
        if (validModels.length > 0) {
          selectEl.value = validModels[0];
          localStorage.setItem('gemini_agent_model', validModels[0]);
          statusEl.style.color = '#16a34a';
          statusEl.textContent = `✅ 已載入 ${validModels.length} 個可用模型（預設：${validModels[0]}）`;
        }
      } catch (err) {
        statusEl.style.color = '#dc2626';
        statusEl.textContent = `❌ 模型清單讀取失敗: ${err.message}`;
      }
    }

    function triggerTool(type) {
      const inputEl = document.getElementById('userInput');
      if (type === 'time') {
        inputEl.value = '現在台灣時間幾點？';
        sendMessage();
      } else if (type === 'calc') {
        const expr = prompt('請輸入要計算的數學算式：', '(1250 + 380) * 1.05');
        if (expr) {
          inputEl.value = `幫我計算：${expr}`;
          sendMessage();
        }
      } else if (type === 'weather') {
        const city = prompt('請輸入想查詢天氣的城市或地區：', '桃園');
        if (city) {
          inputEl.value = `幫我查一下「${city}」現在的天氣如何？`;
          sendMessage();
        }
      }
    }

    const localTools = {
      get_current_time: async () => {
        return new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
      },
      calculate: async ({ expression }) => {
        try {
          const sanitized = expression.replace(/[^0-9+\-*/(). ]/g, '');
          return String(Function(`"use strict"; return (${sanitized})`)());
        } catch (e) {
          return "算式格式錯誤";
        }
      },
      get_weather: async ({ latitude, longitude, location_name }) => {
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`;
          const res = await fetch(url);
          const data = await res.json();
          const cw = data.current_weather;
          return `${location_name || '該地區'}目前氣溫：${cw.temperature}°C，風速：${cw.windspeed} km/h`;
        } catch (e) {
          return "無法取得天氣資訊";
        }
      }
    };

    const toolDeclarations = [{
      functionDeclarations: [
        {
          name: "get_current_time",
          description: "取得目前的台灣本地日期與時間。"
        },
        {
          name: "calculate",
          description: "計算數學四則運算算式。",
          parameters: {
            type: "OBJECT",
            properties: {
              expression: { type: "STRING", description: "數學算式，例如 '(1250 + 380) * 1.05'" }
            },
            required: ["expression"]
          }
        },
        {
          name: "get_weather",
          description: "輸入地點的經緯度以查詢即時天氣。請根據使用者提到的城市名稱自行推算大致的經緯度傳入。",
          parameters: {
            type: "OBJECT",
            properties: {
              latitude: { type: "NUMBER", description: "緯度，例如台北為 25.03" },
              longitude: { type: "NUMBER", description: "經度，例如台北為 121.56" },
              location_name: { type: "STRING", description: "地點名稱，例如 '台北'" }
            },
            required: ["latitude", "longitude"]
          }
        }
      ]
    }];

    function appendMessage(text, type) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearMemory() {
      conversationHistory = [];
      document.getElementById('chatBox').innerHTML = '<div class="msg agent">記憶已清除，隨時可以開始新對話！</div>';
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const apiKey = document.getElementById('apiKey').value.trim();
      const text = inputEl.value.trim();

      if (!apiKey) { alert('請先在左側貼上你的 Gemini API Key！'); return; }
      if (!text) return;

      inputEl.value = '';
      appendMessage(text, 'user');
      conversationHistory.push({ role: "user", parts: [{ text }] });

      await runAgentLoop(apiKey);
    }

    async function runAgentLoop(apiKey) {
      const model = document.getElementById('model').value.trim();
      const systemPrompt = document.getElementById('systemPrompt').value;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: conversationHistory,
            tools: toolDeclarations
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const candidate = data.candidates[0].content;
        conversationHistory.push(candidate);

        const callPart = candidate.parts.find(p => p.functionCall);
        const textPart = candidate.parts.find(p => p.text);

        if (callPart) {
          const { name, args } = callPart.functionCall;
          appendMessage(`⚡ 呼叫工具：${name}(${JSON.stringify(args || {})})`, 'tool');

          const toolResult = localTools[name] ? await localTools[name](args) : "找不到此工具";
          appendMessage(`✅ 工具結果：${toolResult}`, 'tool');

          conversationHistory.push({
            role: "function",
            parts: [{
              functionResponse: {
                name: name,
                response: { result: toolResult }
              }
            }]
          });

          await runAgentLoop(apiKey);
        } else if (textPart) {
          appendMessage(textPart.text, 'agent');
        }
      } catch (err) {
        conversationHistory.pop();
        appendMessage(`❌ 發生錯誤：${err.message}`, 'tool');
      }
    }
  </script>
</body>
</html>
